# Project Parallax — Phase 2 Specification Constants
# Single committed source for all analytic constants.
# WARNING: Editing this file changes the registered specification.
# All constants frozen as of 2026-09-23 (v1.0 preregistration).

[meta]
version        = "1.0"
frozen_date    = "2026-09-23"
governing_doc  = "Project Parallax Phase 2 Preregistration v1.0.docx"
description    = "Canonical constants; mismatch halts empirical run"

# ---------------------------------------------------------------------------
# H1: Bai-Perron structural break detection on z_t = logit(FIRM_share)
# ---------------------------------------------------------------------------
[h1]
max_breaks     = 2          # Never raise; frozen
h_min          = 27         # floor(0.15 × 180); minimum segment length
alpha_udmax    = 0.05       # UDmax significance level
alpha_seq      = 0.05       # Sequential supF(l+1|l) significance level
T              = 180        # Jan 2010–Dec 2024 monthly observations

# ---------------------------------------------------------------------------
# FIRM-share transformation boundary handling
# ---------------------------------------------------------------------------
[transform]
boundary_lower = 1e-6       # Cap lower bound on s_t (FIRM share); exact 0 halts
boundary_upper = 0.999999   # Cap upper bound on s_t; exact 1 halts
# "No extra sensitivity is triggered by a cap" — v1.0 Section 2

# ---------------------------------------------------------------------------
# Bootstrap: Circular Block Bootstrap (H1 model-selection uncertainty)
# ---------------------------------------------------------------------------
[bootstrap]
B              = 1999       # Replicates; fixed
L              = 5          # Block length = floor(180^(1/3)) = floor(5.646) = 5
SEED           = 20260923   # Master seed
# Stream allocation:
#   SEED+0 = H1 bootstrap (numpy.random.default_rng(SEED))
#   SEED+1 = RESERVED AND UNUSED (H2 has no bootstrap)
#   SEED+2 = raw FIRM-share sensitivity (numpy.random.default_rng(SEED+2))
#   SEED+k = child streams (k >= 3)
comparable_replicate_floor = 200   # Minimum same-count replicates; no fallback below

# ---------------------------------------------------------------------------
# H2: Sector heterogeneity system
# ---------------------------------------------------------------------------
[h2]
N_min          = 5          # Minimum valid-data stocks per sector-month
G_min          = 6          # Minimum qualifying sectors; G' < 6 → H2 not computed
G              = 12         # FF12 sector count (full)
kappa_threshold = 1.0e8     # Condition number threshold; κ(M) > 1e8 → not computable
# No prewhitening for H2 HAC (G=12 VAR(1) requires 144 params from T≈180, not feasible)
# Bandwidth: B_T = max(1, max_g B_{T,g}) using per-sector Andrews AR(1) scalar bandwidths
# AR(1) segment < 3 usable obs → assign bandwidth 1

# Wald test critical values (χ² at 5% significance)
[h2.wald]
cv_chi2_11     = 19.68      # χ²(11) at 5%  — one break, G'=12, df = G'−1
cv_chi2_22     = 33.92      # χ²(22) at 5%  — two breaks, G'=12, df = 2(G'−1)
# Contrast matrix R ∈ ℝ^{(G'−1)×G'}: rows = e_{j+1}' − e_1' for j=1,...,G'−1
# Two-break: R_joint = block_diag(R, R); score vector stacked (one per episode)

# ---------------------------------------------------------------------------
# Reproducibility gates (filled before empirical execution)
# ---------------------------------------------------------------------------
[checksums]
# SHA-256 of data/clmx_monthly_decomp_opt_b.csv — MUST be committed before
# empirical H1/H2 execution. Left blank here until Phase 1 output is available
# in this environment. Gate: mismatch halts run.
clmx_monthly_decomp_opt_b_sha256 = ""
ff49_crosswalk_sha256             = ""

# ---------------------------------------------------------------------------
# Reserved for Phase 2.2 / H3 (not in scope for Phase 2.1)
# ---------------------------------------------------------------------------
[events]
# Calendar windows for "extraordinary" episodes — Matt-level governance decision.
# DO NOT POPULATE until Matt signs off. Left empty per preregistration freeze.

# ---------------------------------------------------------------------------
# Package versions (to be locked in requirements-phase2-lock.txt)
# ---------------------------------------------------------------------------
[packages]
# Record exact versions after environment setup. These are minimum constraints.
python_min     = "3.10"
numpy_min      = "1.24"
scipy_min      = "1.10"
pandas_min     = "2.0"
rpy2_min       = "3.5"
# R package: strucchange >= 1.5-3
